<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Homepage Modern</title>
  <!-- Menghubungkan file HTML ke file CSS terpisah -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navbar / Menu Atas -->
  <header>
    <div class="logo">MyBrand</div>
    <nav>
      <ul>
        <li><a href="#">Beranda</a></li>
        <li><a href="#">Fitur</a></li>
        <li><a href="#">Tentang</a></li>
        <li><a href="#">Kontak</a></li>
      </ul>
    </nav>
  </header>

  <!-- Hero Section (Konten Utama) -->
  <main class="hero">
    <div class="hero-text">
      <h1>Kembangkan Ide Kreatif <span>Tanpa Batas</span></h1>
      <p>Buat tampilan web yang modern, interaktif, dan nyaman dilihat. Mulai perjalanan coding kamu dengan desain yang tidak kaku.</p>
      <div class="btn-container">
        <a href="#" class="btn-primary">Mulai Sekarang</a>
        <a href="#" class="btn-secondary">Pelajari Lagi</a>
      </div>
    </div>
    
    <div class="hero-image">
      <!-- Menggunakan Gambar Online dari Unsplash -->
      <img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?auto=format&fit=crop&w=600&q=80" alt="Laptop Koding">
    </div>
  </main>

</body>
</html>
